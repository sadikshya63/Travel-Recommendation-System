{% load static %}
<!DOCTYPE html>
<html>
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<body>

<div class="container mt-4">
    <div class="row">

        {% for place in places %}
        <div class="col-md-4 mb-4">

            <div class="card">

                <img src="{% static place.image%}" class="card-img-top" alt="{{ place.place_name }}">

                <div class="card-body">
                    <h5>{{ place.place_name }}</h5>
                    <p>{{ place.category }}</p>

                    <a href="{% url 'place_detail' place.place_id %}" class="btn btn-success w-100">
                        View Details
                    </a>
                </div>

            </div>

        </div>
        {% endfor %}

    </div>
</div>
